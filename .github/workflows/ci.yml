name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [synchronize, opened, reopened]

jobs:
  streamloom:
    name: streamloom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: go fmt ./...

      - run: go vet ./...

      - run: go fix ./...

      - name: Ensure no changes after formatting and fixing
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "There are uncommitted changes after formatting/fixing. Please commit them before pushing.";
            git --no-pager diff;
            exit 1;
          fi

      - run: go build -ldflags "-X main.Version=test" -v .

      - run: go test -v ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installed from the version devbox.json pins so CI and a local
      # `devbox shell` run the exact same gosec. Renovate already keeps
      # that pin current, so there is no second version to bump here.
      - name: Install gosec
        run: |
          version="$(jq -er '.packages[] | select(startswith("gosec@")) | split("@")[1]' devbox.json)"
          echo "installing gosec v${version} (pinned in devbox.json)"
          go install "github.com/securego/gosec/v2/cmd/gosec@v${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: gosec ./...
